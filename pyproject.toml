[project]
name = "orbital"
version = "0.2.26"
description = "Asistente local para Linux: enrutador qwen local, Gemini y relevo humano."
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
dependencies = ["httpx>=0.27", "rich>=13", "psutil>=5.9", "prompt_toolkit>=3.0", "tomli>=2; python_version<'3.11'"]

[project.scripts]
orbital = "orbital.client:run"
orbitald = "orbital.daemon:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbital*"]
